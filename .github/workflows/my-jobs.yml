# Rebuilds MY_JOBS.md from repo Markdown by default (no secrets). Optional
# SUPABASE_* secrets switch to live database mode.
name: Update MY_JOBS shortlist

on:
  workflow_dispatch:
  schedule:
    # After the main tables job (noon UTC); only updates MY_JOBS.md
    - cron: "30 12 * * *"

permissions:
  contents: write

concurrency:
  group: my-jobs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  my-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts

      - name: Build personal shortlist
        run: npm run my-jobs
        working-directory: .github/scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APPLY_IMG_URL: ${{ secrets.APPLY_IMG_URL }}

      - name: Commit MY_JOBS.md
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MY_JOBS.md
          git diff --staged --quiet || git commit -m "chore: update MY_JOBS personal shortlist"

      - name: Push changes
        if: success()
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ github.token }}
          branch: ${{ github.ref_name }}
